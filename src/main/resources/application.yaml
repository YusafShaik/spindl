spring:
  application:
    name: spindl
  datasource:
    url: ${SPINDL_DB_URL:jdbc:postgresql://localhost:5432/spindl}
    username: ${SPINDL_DB_USERNAME:postgres}
    password: ${SPINDL_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${SPINDL_SMTP_HOST:}
    port: ${SPINDL_SMTP_PORT:587}
    username: ${SPINDL_SMTP_USERNAME:}
    password: ${SPINDL_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPINDL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPINDL_SMTP_STARTTLS:true}
server:
  error:
    include-message: always
spindl:
  platform-billing-emails: ${SPINDL_PLATFORM_BILLING_EMAILS:}
  platform-support-emails: ${SPINDL_PLATFORM_SUPPORT_EMAILS:}
  security:
    jwt-secret: ${SPINDL_JWT_SECRET:local-development-secret-change-before-deploying-2026}
  frontend-url: ${SPINDL_FRONTEND_URL:http://localhost:5173}
  mail:
    enabled: ${SPINDL_MAIL_ENABLED:false}
    from: ${SPINDL_MAIL_FROM:noreply@spindl.local}
  attachments:
    storage-path: ${SPINDL_STORAGE_PATH:./var/spindl-attachments}
    max-file-size-bytes: ${SPINDL_ATTACHMENT_MAX_BYTES:10485760}
    clamav-host: ${SPINDL_CLAMAV_HOST:}
    clamav-port: ${SPINDL_CLAMAV_PORT:3310}
    clamav-timeout-millis: ${SPINDL_CLAMAV_TIMEOUT_MS:5000}
